# =============================================================================
# CONTOH CONFIGMAP KUBERNETES
# =============================================================================
# ConfigMap menyimpan data konfigurasi non-sensitif.
# Bisa di-inject ke Pod sebagai env var atau file mount.
# =============================================================================

# --- ConfigMap Sederhana: Key-Value ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config          # Nama ConfigMap
  namespace: default
  labels:
    app: my-app
    component: config
data:
  # Key-value sederhana (akan jadi environment variables)
  DB_HOST: "postgres-service.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "myappdb"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"
  CACHE_TTL: "3600"
  FEATURE_NEW_UI: "true"    # Feature flag
  APP_ENV: "production"

---
# --- ConfigMap dengan File Content (untuk konfigurasi file) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
  labels:
    app: nginx
data:
  # Key = nama file, Value = isi file
  # File ini akan di-mount sebagai /etc/nginx/conf.d/default.conf
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend-service:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

  # File konfigurasi kedua
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
    }

---
# --- ConfigMap untuk Aplikasi Python (contoh app.ini) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-config
  namespace: default
data:
  # File konfigurasi format INI
  app.ini: |
    [database]
    host = postgres-service
    port = 5432
    name = myappdb
    pool_size = 10
    max_overflow = 20

    [cache]
    backend = redis
    host = redis-service
    port = 6379
    ttl = 3600

    [logging]
    level = INFO
    format = json

  # File konfigurasi format YAML
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      workers: 4

    database:
      url: postgresql://postgres-service:5432/myappdb
      pool:
        min: 2
        max: 10

    features:
      new_dashboard: true
      beta_api: false

---
