# =============================================================================
# CONTOH SECRET KUBERNETES
# =============================================================================
# Secret untuk menyimpan data sensitif.
# PENTING: Value harus di-encode dalam Base64!
#
# Cara encode ke Base64:
#   Linux/macOS: echo -n "nilai" | base64
#   Python:      import base64; base64.b64encode(b"nilai").decode()
# =============================================================================

# --- Secret Tipe Opaque (Umum) ---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
  labels:
    app: my-app
    component: database
type: Opaque    # Tipe paling umum untuk data arbitrary

data:
  # Semua nilai HARUS dalam Base64!
  # Nilai asli: "admin"
  username: YWRtaW4=
  # Nilai asli: "supersecretpassword123"
  password: c3VwZXJzZWNyZXRwYXNzd29yZDEyMw==
  # Nilai asli: "myappdb"
  database: bXlhcHBkYg==

# Alternatif: gunakan stringData (tidak perlu encode Base64)
# Kubernetes akan otomatis encode saat menyimpan
# CATATAN: stringData tidak muncul saat kubectl get secret -o yaml
# stringData:
#   username: "admin"
#   password: "supersecretpassword123"
#   database: "myappdb"

---
# --- Secret untuk API Keys ---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: default
  labels:
    app: my-app
type: Opaque
stringData:   # stringData lebih mudah — tidak perlu encode manual
  STRIPE_SECRET_KEY: "sk_live_xxxxxxxxxxxxxxxxxxxx"
  SENDGRID_API_KEY: "SG.xxxxxxxxxxxxxxxxxxxxxxxxxx"
  JWT_SECRET: "my-very-long-and-secure-jwt-secret-key-do-not-share"
  ENCRYPTION_KEY: "32-character-long-encryption-key"

---
# --- Docker Registry Secret ---
# Untuk pull image dari private registry
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: default
type: kubernetes.io/dockerconfigjson    # Tipe khusus untuk Docker registry

data:
  # Isi .dockerconfigjson adalah JSON yang di-encode Base64
  # Format JSON:
  # {
  #   "auths": {
  #     "registry.example.com": {
  #       "username": "myuser",
  #       "password": "mypassword",
  #       "email": "email@example.com",
  #       "auth": "<base64 encoded username:password>"
  #     }
  #   }
  # }
  #
  # Cara membuat dengan kubectl:
  # kubectl create secret docker-registry registry-credentials \
  #   --docker-server=registry.example.com \
  #   --docker-username=myuser \
  #   --docker-password=mypassword \
  #   --docker-email=email@example.com \
  #   --dry-run=client -o yaml
  .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6Im15dXNlciIsInBhc3N3b3JkIjoibXlwYXNzd29yZCIsImVtYWlsIjoiZW1haWxAZXhhbXBsZS5jb20iLCJhdXRoIjoiYlhsMWMyVnlPbTE1Y0dGemQzOWtZUT09In19fQ==

---
# --- TLS Secret ---
# Untuk HTTPS/TLS di Ingress
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default
type: kubernetes.io/tls    # Tipe khusus untuk TLS

data:
  # Certificate (PEM format, di-encode Base64)
  # Cara generate self-signed cert:
  # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
  #   -keyout tls.key -out tls.crt \
  #   -subj "/CN=myapp.example.com"
  # kubectl create secret tls tls-secret --cert=tls.crt --key=tls.key --dry-run=client -o yaml
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # certificate PEM di-encode Base64
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...  # private key PEM di-encode Base64

---
