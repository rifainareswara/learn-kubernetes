# =============================================================================
# ConfigMap untuk Konfigurasi Backend (Data Non-Sensitif)
# =============================================================================
# ConfigMap menyimpan data konfigurasi yang TIDAK sensitif.
# Data ini disimpan dalam format plain text dan bisa dilihat oleh siapa saja
# yang punya akses ke cluster. Jangan simpan password atau API key di sini!
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: todolist        # Harus sama dengan namespace Deployment
  labels:
    app: backend
data:
  # Nama Service PostgreSQL di Kubernetes
  # Kubernetes DNS akan me-resolve "postgres" ke IP Service postgres
  # Format lengkap: postgres.todolist.svc.cluster.local
  DB_HOST: "postgres"

  # Port default PostgreSQL
  DB_PORT: "5432"

  # Nama database yang digunakan aplikasi
  DB_NAME: "tododb"

---
# =============================================================================
# Secret untuk Kredensial Database (Data Sensitif)
# =============================================================================
# Secret menyimpan data sensitif dalam format base64.
# PENTING: Base64 bukan enkripsi! Siapa pun yang punya akses ke cluster
# bisa mendecode nilainya. Untuk keamanan lebih tinggi, gunakan:
# - Kubernetes RBAC untuk membatasi akses ke Secret
# - External secret managers (HashiCorp Vault, AWS Secrets Manager, dll)
# - Sealed Secrets (Bitnami)
#
# Cara generate nilai base64:
#   echo -n "nilai-kamu" | base64
#
# Cara decode untuk verifikasi:
#   echo "base64-value" | base64 -d
#
# Contoh:
#   echo -n "todouser"  | base64  →  dG9kb3VzZXI=
#   echo -n "P@ssw0rd!" | base64  →  UEBzc3cwcmQh
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: todolist        # Harus sama dengan namespace Deployment
  labels:
    app: backend
type: Opaque             # "Opaque" = data arbitrary (paling umum digunakan)
data:
  # GANTI dengan nilai base64 dari username database kamu
  # Contoh: echo -n "todouser" | base64
  DB_USER: dG9kb3VzZXI=       # Decoded: todouser

  # GANTI dengan nilai base64 dari password database kamu
  # Contoh: echo -n "P@ssw0rd123!" | base64
  DB_PASS: UEBzc3cwcmQxMjMh   # Decoded: P@ssw0rd123!

# =============================================================================
# Catatan Penting tentang Secret:
#
# 1. Secret ini juga perlu dibuat untuk PostgreSQL (lihat 04-database/)
#    agar database tahu username dan password yang harus dikonfigurasi
#
# 2. Di production, pertimbangkan untuk menggunakan:
#    kubectl create secret generic backend-secret \
#      --from-literal=DB_USER=todouser \
#      --from-literal=DB_PASS=P@ssw0rd123! \
#      -n todolist
#    Ini lebih aman karena tidak ada nilai plain text di file YAML
#
# 3. Jangan commit file ini ke Git jika berisi password nyata!
#    Gunakan placeholder dan dokumentasikan cara membuatnya.
# =============================================================================
