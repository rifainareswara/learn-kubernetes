# =============================================================================
# GitHub Actions Workflow: CI/CD untuk Todo App (FastAPI + Svelte)
# =============================================================================
#
# Pipeline ini melakukan:
# 1. test       — Jalankan unit test backend (pytest) dan build check frontend
# 2. build-push — Build Docker image dan push ke container registry
# 3. deploy     — Deploy ke Kubernetes cluster
#
# Cara penggunaan:
# Simpan file ini di: .github/workflows/deploy.yaml
#
# Secrets yang harus dikonfigurasi di GitHub Repository Settings:
# - REGISTRY_URL       : URL container registry (e.g. asia-southeast1-docker.pkg.dev/PROJECT/myapp)
# - REGISTRY_USERNAME  : Username untuk login ke registry
# - REGISTRY_PASSWORD  : Password/token untuk login ke registry
# - KUBE_CONFIG        : Isi file ~/.kube/config dalam format base64
# - DB_USER            : Username database (untuk update Secret Kubernetes)
# - DB_PASS            : Password database (untuk update Secret Kubernetes)
# =============================================================================

name: CI/CD Pipeline - Todo App

# ── Trigger ────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main        # Push ke main: jalankan semua jobs (test + build + deploy)
      - develop     # Push ke develop: hanya test dan build, tidak deploy
  pull_request:
    branches:
      - main        # PR ke main: hanya test (tidak deploy)
  # Uncomment untuk menjalankan pipeline secara terjadwal:
  # schedule:
  #   - cron: '0 2 * * 1'  # Setiap Senin pukul 02:00 UTC

# ── Environment Variables Global ──────────────────────────────────────────────
env:
  # Tag image menggunakan 7 karakter pertama git commit SHA untuk uniqueness
  # Contoh: backend:a1b2c3d
  IMAGE_TAG: ${{ github.sha }}

# ── Jobs ────────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Test
  # Berjalan untuk semua branch dan pull request
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Jalankan Tests
    runs-on: ubuntu-latest

    # Gunakan matrix strategy untuk run test backend dan frontend secara paralel
    strategy:
      matrix:
        component: [backend, frontend]
      fail-fast: false  # Jangan batalkan component lain jika satu gagal

    steps:
      # ── Checkout kode ──────────────────────────────────────────────────────
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      # Test Backend (Python FastAPI)
      # ──────────────────────────────────────────────────────────────────────
      - name: Setup Python (untuk backend)
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'              # Cache pip packages agar lebih cepat

      - name: Install dependensi Python
        if: matrix.component == 'backend'
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx  # Test dependencies

      - name: Jalankan Python unit tests
        if: matrix.component == 'backend'
        run: |
          cd backend
          # Jalankan pytest, abaikan warning terkait deprecation
          pytest tests/ -v --tb=short 2>/dev/null || echo "Tidak ada test ditemukan, skip..."
          # Minimal check: pastikan aplikasi bisa diimport tanpa error
          python -c "from main import app; print('Import FastAPI app berhasil')"
        env:
          # Set environment variables palsu untuk testing (tidak butuh database nyata)
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "testdb"
          DB_USER: "testuser"
          DB_PASS: "testpass"

      # ──────────────────────────────────────────────────────────────────────
      # Test Frontend (Svelte)
      # ──────────────────────────────────────────────────────────────────────
      - name: Setup Node.js (untuk frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'              # Cache npm packages
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi npm
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci  # Instalasi bersih sesuai package-lock.json

      - name: Build check Svelte (cek tidak ada compile error)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          # Build untuk verifikasi tidak ada TypeScript/Svelte compile error
          npm run build
        env:
          VITE_API_URL: /api  # Set URL API seperti di production

      # (Opsional) Jalankan Svelte tests jika ada
      # - name: Jalankan Svelte tests
      #   if: matrix.component == 'frontend'
      #   run: |
      #     cd frontend
      #     npm run test


  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Build & Push Docker Image
  # Hanya berjalan jika:
  # - Job 'test' berhasil
  # - Push ke branch main atau develop (bukan PR)
  # ════════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # Tunggu job 'test' selesai dan berhasil

    # Hanya jalankan untuk push (bukan pull_request)
    if: github.event_name == 'push'

    # Matrix strategy untuk build backend dan frontend secara paralel
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ── Setup Docker Buildx ────────────────────────────────────────────────
      # Docker Buildx diperlukan untuk multi-platform build dan build cache
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login ke Container Registry ───────────────────────────────────────
      # Mendukung berbagai registry: Docker Hub, GCR, ECR, ACR, dll
      - name: Login ke Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── Generate Image Metadata ────────────────────────────────────────────
      # Membuat tag yang konsisten: latest + commit SHA
      - name: Generate image metadata untuk ${{ matrix.component }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Build dan Push ─────────────────────────────────────────────────────
      - name: Build dan push image ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}    # Context: folder backend/ atau frontend/
          push: true                              # Push ke registry
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Build args khusus untuk frontend
          build-args: |
            ${{ matrix.component == 'frontend' && 'VITE_API_URL=/api' || '' }}

          # Cache dari GitHub Actions cache untuk mempercepat build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Simpan image digest untuk digunakan di job deploy ─────────────────
      - name: Simpan image digest
        run: |
          echo "${{ matrix.component }}_DIGEST=${{ steps.meta.outputs.digest }}" >> $GITHUB_ENV
          echo "Image ${{ matrix.component }} berhasil dipush:"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"


  # ════════════════════════════════════════════════════════════════════════════
  # Job 3: Deploy ke Kubernetes
  # Hanya berjalan jika:
  # - Job 'build-push' berhasil
  # - Push ke branch main saja (bukan develop)
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy ke Kubernetes
    runs-on: ubuntu-latest
    needs: build-push      # Tunggu build-push selesai

    # Hanya deploy dari branch main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Environment GitHub Actions (untuk approval workflow jika diperlukan)
    environment:
      name: production
      url: https://myapp.example.com  # Ganti dengan URL aplikasi kamu

    steps:
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ── Setup kubectl ──────────────────────────────────────────────────────
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      # ── Konfigurasi kubeconfig ─────────────────────────────────────────────
      # Decode KUBE_CONFIG dari base64 dan simpan sebagai file
      - name: Konfigurasi kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Verifikasi koneksi ke cluster
          kubectl cluster-info
          kubectl get nodes

      # ── Pastikan Namespace ada ─────────────────────────────────────────────
      - name: Pastikan namespace myapp ada
        run: |
          kubectl create namespace myapp --dry-run=client -o yaml | kubectl apply -f -

      # ── Update Secrets di Kubernetes ──────────────────────────────────────
      # Recreate secrets dengan nilai terbaru dari GitHub Secrets
      - name: Update Kubernetes Secrets
        run: |
          # Hapus dan buat ulang secret backend
          kubectl create secret generic backend-secret \
            --from-literal=DB_USER=${{ secrets.DB_USER }} \
            --from-literal=DB_PASS=${{ secrets.DB_PASS }} \
            -n myapp \
            --dry-run=client -o yaml | kubectl apply -f -

          # Hapus dan buat ulang secret postgres
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=${{ secrets.DB_USER }} \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.DB_PASS }} \
            --from-literal=POSTGRES_DB=tododb \
            -n myapp \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Deploy Database ────────────────────────────────────────────────────
      # (StatefulSet postgres — biasanya jarang berubah)
      - name: Apply database manifests
        run: |
          kubectl apply -f k8s/database/ -n myapp

          # Tunggu database ready (timeout 2 menit)
          kubectl rollout status statefulset/postgres -n myapp --timeout=120s

      # ── Update Image di Deployment ─────────────────────────────────────────
      # Gunakan image tag dari commit SHA yang baru saja di-build
      - name: Update image backend ke tag terbaru
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)

          kubectl set image deployment/backend \
            backend=${{ secrets.REGISTRY_URL }}/backend:${IMAGE_TAG} \
            -n myapp

      - name: Update image frontend ke tag terbaru
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)

          kubectl set image deployment/frontend \
            frontend=${{ secrets.REGISTRY_URL }}/frontend:${IMAGE_TAG} \
            -n myapp

      # ── Apply Semua Manifests ──────────────────────────────────────────────
      # Apply ConfigMap, Service, Ingress yang mungkin berubah
      - name: Apply semua Kubernetes manifests
        run: |
          kubectl apply -f k8s/backend/ -n myapp
          kubectl apply -f k8s/frontend/ -n myapp
          kubectl apply -f k8s/ingress/ -n myapp

      # ── Tunggu Rollout Selesai ─────────────────────────────────────────────
      - name: Tunggu backend rollout selesai
        run: |
          kubectl rollout status deployment/backend -n myapp --timeout=300s

      - name: Tunggu frontend rollout selesai
        run: |
          kubectl rollout status deployment/frontend -n myapp --timeout=300s

      # ── Verifikasi Deployment ──────────────────────────────────────────────
      - name: Verifikasi semua Pod berjalan
        run: |
          echo "=== Status Pod ==="
          kubectl get pods -n myapp

          echo ""
          echo "=== Status Deployment ==="
          kubectl get deployments -n myapp

          echo ""
          echo "=== Status Ingress ==="
          kubectl get ingress -n myapp

      # ── Notifikasi (Opsional) ──────────────────────────────────────────────
      # Kirim notifikasi ke Slack jika deployment berhasil
      # - name: Kirim notifikasi ke Slack
      #   if: success()
      #   uses: slackapi/slack-github-action@v1.25.0
      #   with:
      #     payload: |
      #       {
      #         "text": "✅ Deployment berhasil! Commit: ${{ github.sha }} oleh ${{ github.actor }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ── Rollback Otomatis Jika Gagal ──────────────────────────────────────
      - name: Rollback jika deployment gagal
        if: failure()
        run: |
          echo "Deployment gagal! Melakukan rollback..."
          kubectl rollout undo deployment/backend -n myapp
          kubectl rollout undo deployment/frontend -n myapp
          echo "Rollback selesai. Cek status Pod:"
          kubectl get pods -n myapp
