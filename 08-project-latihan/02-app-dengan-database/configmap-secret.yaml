# =============================================================================
# PROJECT 02: CONFIGMAP DAN SECRET
# =============================================================================

# --- ConfigMap: Konfigurasi non-sensitif ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  labels:
    project: latihan-02
data:
  # Database connection info (non-sensitif)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "myappdb"
  DB_USER: "appuser"

  # Backend config
  API_PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "http://localhost:30090"

  # Frontend config
  REACT_APP_API_URL: "http://localhost:30091"
  REACT_APP_NAME: "MyApp"

---
# --- Secret: Data sensitif ---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: default
  labels:
    project: latihan-02
type: Opaque
stringData:
  # Password database (ganti di production!)
  DB_PASSWORD: "devpassword123"
  # JWT secret untuk autentikasi
  JWT_SECRET: "my-jwt-secret-key-for-development-only"
  # API key (contoh)
  EXTERNAL_API_KEY: "dev-api-key-placeholder"
