# =============================================================================
# PROJECT 02: BACKEND API (Node.js)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
    project: latihan-02
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      # Init container: tunggu database ready sebelum backend start
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c',
          'until nc -z postgres-service 5432;
           do echo "Menunggu PostgreSQL..."; sleep 2;
           done;
           echo "PostgreSQL siap!"']

      containers:
      - name: backend
        # Di production, ganti dengan image aplikasimu
        # Untuk demonstrasi kita pakai nginx yang mengemulasi backend
        image: nginx:1.25
        ports:
        - containerPort: 80
          name: http

        # Inject konfigurasi dari ConfigMap
        envFrom:
        - configMapRef:
            name: app-config

        # Inject secret
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15

---
# Service untuk backend
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
    project: latihan-02
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - name: http
    port: 3000
    targetPort: 80
    nodePort: 30091
