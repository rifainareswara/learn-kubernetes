# =============================================================================
# PROJECT 01: NGINX SEDERHANA
# =============================================================================
# Deploy nginx dengan 3 replicas dan NodePort Service.
# Tujuan: latihan Deployment, Service, rolling update, scaling.
# =============================================================================

# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
  labels:
    app: nginx
    project: latihan-01
spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # Zero-downtime update

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25

        ports:
        - containerPort: 80

        # Custom nginx config yang menampilkan hostname Pod
        # Berguna untuk membuktikan load balancing bekerja
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c",
                "echo '<h1>Nginx Pod: '$(hostname)'</h1>' > /usr/share/nginx/html/index.html"]

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

---
# --- NodePort Service ---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: default
  labels:
    app: nginx
    project: latihan-01
spec:
  type: NodePort

  selector:
    app: nginx          # Pilih Pod dengan label app=nginx

  ports:
  - name: http
    port: 80            # Port Service (ClusterIP)
    targetPort: 80      # Port Pod
    nodePort: 30080     # Port eksternal (30000-32767)
    protocol: TCP

# Cara akses:
# Minikube: http://<minikube-ip>:30080
# Kind: http://localhost:30080 (jika port mapping dikonfigurasi)
# Port-forward: kubectl port-forward service/nginx-service 8080:80
